<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin Dashboard</title>
</head>
<body>
    
    <div class="sidebar">
        <img class="menu_element logo_icon" src="/sidebar_images/DashboardIcon.svg">
        <h2 class="logo">Dashboard</h2>

        <div class="menu_element space icon"></div>
        <div class="menu_element space"></div>

        <img class="menu_element first icon" src="/sidebar_images/HomeIcon.svg">
        <div class="menu_element first">Home</div>

        <img class="menu_element second icon" src="/sidebar_images/ProfileIcon.svg">
        <div class="menu_element second">Profile</div>

        <img class="menu_element third icon" src="/sidebar_images/MessageIcon.svg">
        <div class="menu_element third">Messages</div>

        <img class="menu_element fourth icon" src="/sidebar_images/HistoryIcon.svg">
        <div class="menu_element fourth">History</div>

        <img class="menu_element fifth icon" src="/sidebar_images/TasksIcon.svg">
        <div class="menu_element fifth">Tasks</div>

        <img class="menu_element sixth icon" src="/sidebar_images/CommunitiesIcon.svg">
        <div class="menu_element sixth">Communities</div>

        <div class="menu_element space icon"></div>
        <div class="menu_element space"></div>

        <img class="menu_element seventh icon" src="/sidebar_images/SettingsIcon.svg">
        <div class="menu_element seventh">Settings</div>

        <img class="menu_element eighth icon" src="/sidebar_images/SupportIcon.svg">
        <div class="menu_element eighth">Support</div>

        <img class="menu_element ninth icon" src="/sidebar_images/PrivacyIcon.svg">
        <div class="menu_element ninth">Privacy</div>
    </div>

    <div class="principal_body">
        <div class="header">
            <div class="top_functionality">
                <img class="header_element icon" src="header_images/SearchIcon.svg">
                <div class="header_element search_bar"></div>

                <div class="header_element space"></div>

                <img class="header_element icon" src="/header_images/NotificationIcon.svg">

                <img class="header_element icon user_profile user_image_mini" src="https://www.svgrepo.com/show/384670/account-avatar-profile-user.svg">
                <div class="header_element user_profile user_name"><strong>Morgan Oakley</strong></div>
            </div>

            <div class="user_functionality">
                <img class="header_element icon user_profile user_image" src="https://www.svgrepo.com/show/384670/account-avatar-profile-user.svg">
                <div class="header_element greetings">
                    <div class="header_element greetings_hi_there"><strong>Hi there,</strong></div>
                    <div class="header_element greetings_user_name"><strong>Morgan Oakley (@morgan)</strong></div>
                </div>

                <div class="header_element space"></div>

                <div class="header_element button first">New</div>
                <div class="header_element button second">Upload</div>
                <div class="header_element button third">Share</div>
            </div>
        </div>

        <div class="projects_section">
            <div class="projects_title"><h3>Your Projects</h3></div>
            <div class="projects_content">
                <div class="project first">
                    <div class="yellow_stripe"></div>
                    <div class="principal_content">
                        <div class="text_content"></div>
                        <div class="functionality_content"></div>
                    </div>
                </div>
                <div class="project second">
                    <div class="yellow_stripe"></div>
                    <div class="principal_content">
                        <div class="text_content"></div>
                        <div class="functionality_content"></div>
                    </div>
                </div>
                <div class="project third">
                    <div class="yellow_stripe"></div>
                    <div class="principal_content">
                        <div class="text_content"></div>
                        <div class="functionality_content"></div>
                    </div>
                </div>
                <div class="project fourth">
                    <div class="yellow_stripe"></div>
                    <div class="principal_content">
                        <div class="text_content"></div>
                        <div class="functionality_content"></div>
                    </div>
                </div>
                <div class="project fifth">
                    <div class="yellow_stripe"></div>
                    <div class="principal_content">
                        <div class="text_content"></div>
                        <div class="functionality_content"></div>
                    </div>
                </div>
                <div class="project sixth">
                    <div class="yellow_stripe"></div>
                    <div class="principal_content">
                        <div class="text_content"></div>
                        <div class="functionality_content"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="information_content"></div>
    </div>

</body>
</html>
